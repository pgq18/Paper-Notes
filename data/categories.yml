    title: RL Post-Training
    icon: 🎯
    description: 围绕强化学习后训练的论文精读与方法分析。
  - id: test-time-policy-steering
    title: Test-Time Policy Steering
    description: 围绕部署时通过价值引导、候选动作重排与策略选择改善机器人行为的论文精读。
  - id: real-time-vla
